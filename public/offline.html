<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d5fbf">
  <title>Sem internet · SOS Bikes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #f5f7fa; color: #0f1b2d; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 360px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px 24px; }
    .icone { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: #1d5fbf; display: flex; align-items: center; justify-content: center; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: #4a5568; font-size: 15px; line-height: 1.5; }
    button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #1d5fbf; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:hover { background: #164a96; }
  </style>
</head>
<body>
  <main>
    <div class="icone" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2l1.5 11.5"/><path d="M5.5 17.5 9 10h7l-4.5 7.5"/><path d="M9 10 8 7H6"/>
      </svg>
    </div>
    <h1>Você está sem internet</h1>
    <p>O SOS Bikes precisa de conexão para pedir socorro e falar com o mecânico. Confira o Wi-Fi ou os dados móveis.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
